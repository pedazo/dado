# Synthetic benchmark case registry — versioned and clearly marked as fixture data.
# None of the numbers attached to cases are real; they only parameterize routing
# and aggregation semantics for offline, network-free checks.
version: 1
synthetic: true
cases:
  - id: CASE-small-edit
    name: Fix a typo in one install hint
    category: small_edit
    description: One file, three lines, no dependencies; a clean isolated change.
    files_touched: 1
    lines_estimate: 3
    risk: low
    uncertainty: 0.05
    dependencies: 0
    acceptance:
      - exact substring replaced
      - no other files changed
  - id: CASE-multfile-bug
    name: Off-by-one config parsing across three files
    category: multfile_bug
    description: Defect spans parser and two call sites; one prior task depends on the fix.
    files_touched: 3
    lines_estimate: 60
    risk: medium
    uncertainty: 0.45
    dependencies: 1
    acceptance:
      - regression test added and passing
      - both call sites updated coherently
  - id: CASE-transversal-change
    name: Rename a public API and every call site
    category: transversal_change
    description: Wide-reaching rename with high regression risk and order matters.
    files_touched: 8
    lines_estimate: 220
    risk: high
    uncertainty: 0.7
    dependencies: 2
    acceptance:
      - no stale references remain
      - full focused test suite passes
  - id: CASE-parallel-research
    name: Survey three docs and compare trade-offs
    category: parallel_research
    description: Read-only research spread over independent documents.
    files_touched: 0
    lines_estimate: 0
    read_only: true
    risk: low
    uncertainty: 0.6
    dependencies: 0
    acceptance:
      - all three sources covered with citations
      - uncertainty stated per claim
  - id: CASE-sequential-workflow
    name: Staged migration with four ordered packets
    category: sequential_workflow
    description: Strictly ordered DAG; each stage verifies before the next starts.
    files_touched: 5
    lines_estimate: 180
    risk: medium
    uncertainty: 0.5
    dependencies: 3
    acceptance:
      - stages run in DAG order
      - each stage has verifier PASS before the next starts
  - id: CASE-interrupted-resume
    name: Reconcile running tasks after an interrupted session
    category: interrupted_resume
    description: Crash mid-execution; reconcile states without re-running done work.
    files_touched: 1
    lines_estimate: 20
    risk: medium
    uncertainty: 0.35
    dependencies: 0
    acceptance:
      - no done task is re-executed
      - states match the event log after recovery
